# Values for the local minikube cluster, deployed by Argo CD.
existingSecret: taskflow-secret

config:
  apiUrl: http://localhost:8000

backend:
  replicaCount: 5
  image:
    tag: "1.5.0"

frontend:
  image:
    tag: "1.3.0"

worker:
  image:
    tag: "1.3.0"

# Helm hooks and tests do not fit the Argo CD sync model here:
# the pre-upgrade hook would run before the database exists.
hooks:
  preUpgrade:
    enabled: false

tests:
  enabled: false


# Canary release of the backend with Argo Rollouts.
rollout:
  enabled: true
  strategy:
    canary:
      steps:
        - setWeight: 20
        - pause: {}
        - setWeight: 60
        - pause: {duration: 30s}
        - setWeight: 80
        - pause: {duration: 30s}