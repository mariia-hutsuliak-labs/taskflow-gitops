# Values for the local minikube cluster, deployed by Argo CD.
existingSecret: taskflow-secret

config:
  apiUrl: http://localhost:8000

backend:
  replicaCount: 5
  image:
    tag: "1.7.0"
  # Share of requests answered with HTTP 500 (0-1); non-zero only to demo a bad release.
  failRate: "0"

frontend:
  image:
    tag: "1.3.0"

worker:
  image:
    tag: "1.3.0"

# Helm hooks and tests do not fit the Argo CD sync model here:
# the pre-upgrade hook would run before the database exists.
hooks:
  preUpgrade:
    enabled: false

tests:
  enabled: false

metrics:
  enabled: true

# Canary release of the backend with Argo Rollouts.
# The decision to continue is made by the analysis step, not by a manual promote.
rollout:
  enabled: true
  analysis:
    enabled: true
    prometheusAddress: http://kps-prometheus.monitoring:9090
    selector: 'namespace="taskflow"'
  strategy:
    canary:
      steps:
        - setWeight: 20
        - pause: {duration: 30s}
        - analysis:
            templates:
              - templateName: taskflow-success-rate
        - setWeight: 60
        - pause: {duration: 30s}
